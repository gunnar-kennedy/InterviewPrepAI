        <script>
            !function(window){
              const host = "https://labs.heygen.com";
              const url = host + "/guest/streaming-embed?share=eyJxdWFsaXR5IjoiaGlnaCIsImF2YXRhck5hbWUiOiJTYW50YV9GaXJlcGxhY2VfRnJvbnRfcHVi%0D%0AbGljIiwicHJldmlld0ltZyI6Imh0dHBzOi8vZmlsZXMyLmhleWdlbi5haS9hdmF0YXIvdjMvM2I0%0D%0AZTQ2NGJmMTVmNDE5NGIwODJiZTBlNjMxMzU0YzZfNDY4NjAvcHJldmlld190YXJnZXQud2VicCIs%0D%0AIm5lZWRSZW1vdmVCYWNrZ3JvdW5kIjpmYWxzZSwia25vd2xlZGdlQmFzZUlkIjoiNjVjOTVlZjAx%0D%0AZmY4NDYzMmI2YzE2OGNhZTkyZDdhODYiLCJ1c2VybmFtZSI6ImJjYjc1Zjk1NWE5MDRiZmZiNTE5%0D%0ANGNiMTk4ZTliODJkIn0%3D&inIFrame=1";
              const clientWidth = document.body.clientWidth;
            
              // Create outer wrapper
              const wrapDiv = document.createElement("div");
              wrapDiv.id = "heygen-streaming-embed";
            
              // *** Ensure the wrapper is always visible and expanded from the start ***
              wrapDiv.classList.add("show", "expand");
            
              // Container for the iframe
              const container = document.createElement("div");
              container.id = "heygen-streaming-container";
            
              // Create style element
              const stylesheet = document.createElement("style");
              stylesheet.innerHTML = `
                #heygen-streaming-embed {
                  z-index: 9999;
                  position: fixed;
                  left: 225px;
                  bottom: 250px;
                  width: 400px;
                  height: 400px;
                  border-radius: 50%;
                  border: 2px solid #fff;
                  box-shadow: 0px 8px 24px 0px rgba(0, 0, 0, 0.12);
                  transition: all linear 0.1s;
                  overflow: hidden;
                  opacity: 0;
                  visibility: hidden;
                }
                #heygen-streaming-embed.show {
                  opacity: 1;
                  visibility: visible;
                }
                #heygen-streaming-embed.expand {
                  ${
                    clientWidth < 540
                      ? "height: 266px; width: 96%; left: 50%; transform: translateX(-50%);"
                      : "height: 366px; width: calc(366px * 16 / 9);"
                  }
                  border: 0;
                  border-radius: 8px;
                }
                #heygen-streaming-container {
                  width: 100%;
                  height: 100%;
                }
                #heygen-streaming-container iframe {
                  width: 100%;
                  height: 100%;
                  border: 0;
                }
              `;
            
              // Create the iframe
              const iframe = document.createElement("iframe");
              iframe.allowFullscreen = false;
              iframe.title = "Streaming Embed";
              iframe.role = "dialog";
              iframe.allow = "microphone";
              iframe.src = url;
            
              // --- Remove or comment out the message listener logic to avoid toggling ---
              /*
              window.addEventListener("message", (e) => {
                if (e.origin === host && e.data && e.data.type && e.data.type === "streaming-embed") {
                  if (e.data.action === "init") {
                    wrapDiv.classList.add("show");
                  } else if (e.data.action === "show") {
                    wrapDiv.classList.add("expand");
                  } else if (e.data.action === "hide") {
                    wrapDiv.classList.remove("expand");
                  }
                }
              });
              */
            
              // Append everything
              container.appendChild(iframe);
              wrapDiv.appendChild(stylesheet);
              wrapDiv.appendChild(container);
              document.body.appendChild(wrapDiv);
            }(globalThis);
            </script>
