<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <header>
        <h1>Mock Interview Assistant</h1>
    </header>

    <div id = "content">
        <div class = "section">
            <br>
            <label for="pdf-upload-input">Upload Resume PDF:</label>
            <br>
            <input type="file" id="uploadedPDF" accept=".pdf">
            <iframe id="pdf-preview" style="display: none; height: 500px; width: 80%;padding-left: 10%;padding-top: 10%;"></iframe>
        </div>
        <div class = "section">
            <br>
            <label> Enter Job Description:</label>
            <textarea placeholder="Enter your text here..."></textarea>
        </div>
        <div class = "section">            
            <button id="StartInterviewButton">Begin Interview with AI Interviewer</button>
        </div>
        
        
    </div>


   
</body>
<script src="script1.js"></script>
</html>
